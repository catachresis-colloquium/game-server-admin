# SPDX-License-Identifier: MPL-2.0
#
# game-server-admin selur-compose configuration
#
# Orchestrates the container stack as verified container bundles (.ctp).
# Uses selur zero-copy IPC between services on the same host.
#
# Usage:
#   selur-compose up                     # Start all services
#   selur-compose up --detach            # Start in background
#   selur-compose verify                 # Verify all .ctp signatures
#   selur-compose ps                     # Check status
#   selur-compose logs -f gsa  # Stream logs
#   selur-compose down                   # Stop all services
#
# Fallback (when selur is not installed):
#   podman compose --file compose.toml up --detach

version = "1.0"

# ============================================================================
# Services
# ============================================================================

# Primary application service
[services.gsa]
image = "ghcr.io/hyperpolymath/gsa:latest.ctp"
ports = ["8090:8090"]
environment = {
  APP_HOST = "[::]",
  APP_PORT = "8090",
  APP_LOG_FORMAT = "json",
  APP_DATA_DIR = "/data",
  # GSA uses the Podman socket to execute lifecycle actions against
  # managed game server containers (start/stop/restart/update/backup).
  # The socket path follows XDG_RUNTIME_DIR for rootless Podman on AlmaLinux 9.7.
  PODMAN_SOCKET = "/run/podman/podman.sock",
  GSA_GAME_PROFILES_DIR = "/app/profiles",
}
volumes = [
  "gsa-data:/data",
  # This socket is a legacy container-administration capability; no game
  # server is a dependency of the GSA service stack.
  # On Verpex (AlmaLinux 9.7, rootless): ${XDG_RUNTIME_DIR}/podman/podman.sock
  # Set PODMAN_SOCKET_HOST in the environment before running selur-compose.
  "${PODMAN_SOCKET_HOST:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock",
]
restart = "always"
depends_on = ["gsa-verisimdb"]
healthcheck = { test = "curl -sf http://localhost:8090/health", interval = "30s", timeout = "5s", retries = 3 }

# CryoFall is deliberately absent from this GSA/VeriSimDB stack. Its game
# runtime is an independent systemd service described by a deployment
# instance; a control-plane failure cannot gate game startup.

# Svalinn edge gateway: validates requests, enforces policies, TLS termination
[services.svalinn]
image = "ghcr.io/hyperpolymath/svalinn:latest.ctp"
ports = ["443:443", "80:80"]
environment = {
  SVALINN_BACKEND = "http://gsa:8090",
  SVALINN_POLICY_FILE = "/etc/svalinn/gatekeeper.yaml",
  SVALINN_TLS_AUTO = "true",
}
volumes = ["svalinn-config:/etc/svalinn:ro"]
depends_on = ["gsa"]
restart = "always"
healthcheck = { test = "curl -sf http://localhost:80/health", interval = "30s", timeout = "5s", retries = 3 }

# ============================================================================
# Volumes
# ============================================================================

[volumes.gsa-data]
driver = "local"

[volumes.svalinn-config]
driver = "local"

# ============================================================================
# Networks
# ============================================================================

# Use selur zero-copy IPC for inter-service communication on the same host.
# Falls back to standard bridge networking when selur driver is unavailable.
[networks.default]
driver = "selur"
