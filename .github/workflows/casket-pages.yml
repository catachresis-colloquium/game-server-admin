# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # casket-ssg pulls in pandoc, a from-source build. Measured on main: run
    # 35361659693 took 1h40m before failing. 30 minutes was never going to be
    # enough.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout casket-ssg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/casket-ssg
          path: .casket-ssg

      # MEASURED, not assumed. A throwaway probe workflow on this branch
      # (since deleted) loaded both actions and GitHub refused both in one
      # message:
      #
      #   The actions editorconfig-checker/action-editorconfig-checker@51f6331
      #   and haskell-actions/setup@0f8e8c99 are not allowed in
      #   hyperpolymath/game-server-admin because all actions must be from a
      #   repository owned by hyperpolymath, created by GitHub, or verified in
      #   the GitHub Marketplace.
      #
      # So the toolchain is installed from a pinned, hash-verified script —
      # the same remedy used for setup-zig in scripts/install-zig.sh.
      - name: Setup GHC and cabal
        run: bash scripts/setup-haskell.sh

      # The checked-out casket-ssg tracks its default branch, so hashing only
      # the .cabal file can restore a store built against different source.
      - name: Record casket-ssg revision
        id: casket
        run: echo "sha=$(git -C .casket-ssg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Cabal
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            .casket-ssg/dist-newstyle
          key: ${{ runner.os }}-casket-9.8.2-${{ steps.casket.outputs.sha }}

      - name: Build casket-ssg
        working-directory: .casket-ssg
        run: |
          cabal update
          cabal build

      - name: Prepare site source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .site-src _site

          if [ -d site ]; then
            cp -R site .site-src
          else
            mkdir -p .site-src
            TODAY="$(date +%Y-%m-%d)"
            REPO_NAME="${{ github.event.repository.name }}"
            REPO_URL="https://github.com/${{ github.repository }}"
            README_URL=""

            if [ -f README.md ]; then
              README_URL="${REPO_URL}/blob/${{ github.ref_name }}/README.md"
            elif [ -f README.adoc ]; then
              README_URL="${REPO_URL}/blob/${{ github.ref_name }}/README.adoc"
            fi

            {
              echo "---"
              echo "title: ${REPO_NAME}"
              echo "date: ${TODAY}"
              echo "---"
              echo
              echo "# ${REPO_NAME}"
              echo
              echo "Static documentation site for ${REPO_NAME}."
              echo
              echo "- Source repository: [${{ github.repository }}](${REPO_URL})"
              if [ -n "${README_URL}" ]; then
                echo "- README: [project README](${README_URL})"
              fi
              if [ -d docs ]; then
                echo "- Docs directory: [docs/](${REPO_URL}/tree/${{ github.ref_name }}/docs)"
              fi
              echo
              echo "Project-specific site content can be added later under site/."
            } > .site-src/index.md
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cd .casket-ssg && cabal run casket-ssg -- build ../.site-src ../_site
          touch ../_site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
